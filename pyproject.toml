[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keepygaga-rag"
version = "0.1.0"
description = "Local-first knowledge retrieval for AI agents."
readme = "README.md"
license = "MIT"
authors = [{ name = "TimWongUp" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "filelock>=3.16,<4",
  "httpx>=0.27,<1",
  "jieba>=0.42.1,<0.43",
  "lancedb>=0.34,<0.35",
  "mcp>=2.1,<3",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dashboard = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pyright>=1.1.400,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
keepygaga-rag = "keepygaga_rag.cli:main"

[project.urls]
Homepage = "https://github.com/TimWongUp/keepygaga-rag"
Issues = "https://github.com/TimWongUp/keepygaga-rag/issues"
Repository = "https://github.com/TimWongUp/keepygaga-rag.git"

[tool.setuptools.packages.find]
include = ["keepygaga_rag*"]

[tool.setuptools.package-data]
"keepygaga_rag.dashboard" = [
  "templates/*.html",
  "static/*.css",
  "static/*.js",
  "static/*.svg",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["keepygaga_rag", "mcp_server.py", "scripts", "tests"]
exclude = ["**/__pycache__", ".keepygaga", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["."]
